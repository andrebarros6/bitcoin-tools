name: Update Cabaz Data

on:
  schedule:
    - cron: "0 9 * * 3"  # weekly, Wednesday 09:00 UTC
  workflow_dispatch:      # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Scrape cabaz data and merge with BTC price
        # Publico is the primary source but has stalled for weeks at a time.
        # Don't let a bad fetch here stop the news fallback from running.
        continue-on-error: true
        run: python cabaz/publico_update.py

      - name: Fill any gaps from news coverage
        # Only writes weeks Publico hasn't already supplied, so this is a
        # no-op whenever the primary source is keeping up.
        run: python cabaz/news_update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cabaz/infogram_data_with_btc.csv
          git diff --cached --quiet || git commit -m "chore: update cabaz alimentar data [$(date -u +%Y-%m-%d)]"
          git push
